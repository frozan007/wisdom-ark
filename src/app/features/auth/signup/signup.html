<section class="auth-page">

  <article class="auth-card">

    <div class="brand">

      <img
        src="assets/branding/wisdom-ark-icon.png"
        alt="Wisdom Ark"
      />

      <div>
        <h1>Wisdom Ark</h1>
        <span>Tuition Management</span>
      </div>

    </div>


    <header>
      <h2>Create Account</h2>

      <p>
        Create your Wisdom Ark
        administrator account.
      </p>
    </header>


    @if (errorMessage()) {

      <div class="message error">
        <mat-icon>error</mat-icon>
        {{ errorMessage() }}
      </div>

    }


    @if (successMessage()) {

      <div class="message success">
        <mat-icon>mark_email_read</mat-icon>
        {{ successMessage() }}
      </div>

    }


    <form
      [formGroup]="form"
      (ngSubmit)="signup()"
    >

      <label>
        <span>Full Name</span>

        <div class="input-wrapper">
          <mat-icon>person</mat-icon>

          <input
            type="text"
            formControlName="full_name"
            placeholder="Your full name"
          />
        </div>
      </label>


      <label>
        <span>Email</span>

        <div class="input-wrapper">
          <mat-icon>mail</mat-icon>

          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
          />
        </div>
      </label>


      <label>
        <span>Password</span>

        <div class="input-wrapper">
          <mat-icon>lock</mat-icon>

          <input
            [type]="
              showPassword()
                ? 'text'
                : 'password'
            "
            formControlName="password"
            placeholder="Minimum 8 characters"
          />

          <button
            type="button"
            class="visibility-button"
            (click)="togglePassword()"
          >
            <mat-icon>
              {{
                showPassword()
                  ? 'visibility_off'
                  : 'visibility'
              }}
            </mat-icon>
          </button>
        </div>
      </label>


      <label>
        <span>Confirm Password</span>

        <div class="input-wrapper">
          <mat-icon>lock</mat-icon>

          <input
            [type]="
              showConfirmPassword()
                ? 'text'
                : 'password'
            "
            formControlName="confirm_password"
            placeholder="Repeat your password"
          />

          <button
            type="button"
            class="visibility-button"
            (click)="toggleConfirmPassword()"
          >
            <mat-icon>
              {{
                showConfirmPassword()
                  ? 'visibility_off'
                  : 'visibility'
              }}
            </mat-icon>
          </button>
        </div>
      </label>


      <button
        mat-flat-button
        class="primary-button"
        type="submit"
        [disabled]="loading()"
      >

        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          <mat-icon>person_add</mat-icon>
        }

        {{
          loading()
            ? 'Creating account...'
            : 'Create Account'
        }}

      </button>

    </form>


    <div class="login-link">
      Already have an account?

      <a routerLink="/login">
        Sign in
      </a>
    </div>

  </article>

</section>
